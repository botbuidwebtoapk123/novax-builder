name: Build APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Website URL to load in WebView'
        required: true
        default: 'https://google.com'
      app_name:
        description: 'Application name'
        required: true
        default: 'My App'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Set App Name and URL
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          WEBSITE_URL="${{ github.event.inputs.website_url }}"
          sed -i "s|android:label=\".*\"|android:label=\"${APP_NAME}\"|g" android/app/src/main/AndroidManifest.xml
          sed -i "s|WEBSITE_URL_PLACEHOLDER|${WEBSITE_URL}|g" lib/main.dart
          sed -i "s|description:.*|description: \"${APP_NAME}\"|g" pubspec.yaml
          echo "App Name: ${APP_NAME}"
          echo "Website URL: ${WEBSITE_URL}"

      - name: Process Icon
        run: |
          sudo apt-get install -y imagemagick
          if [ -f "icon.png" ]; then
            convert icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "Icons resized!"
          else
            echo "No icon found"
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          SAFE_NAME=$(echo "$APP_NAME" | tr ' ' '_' | tr -cd '[:alnum:]_')
          cp build/app/outputs/flutter-apk/app-release.apk "${SAFE_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: "*.apk"
          retention-days: 1
